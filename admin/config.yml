backend:
  name: github
  repo: Jorgez-tech/pagina_personal
  branch: master

media_folder: "img"
public_folder: "/img"

collections:
  - name: "config"
    label: "Configuración del Sitio"
    files:
      - label: "Información Personal"
        name: "personal_info"
        file: "admin/data/personal.json"
        fields:
          - {label: "Nombre", name: "name", widget: "string"}
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Teléfono", name: "phone", widget: "string"}
          - {label: "Ubicación", name: "location", widget: "string"}
          - {label: "Descripción", name: "description", widget: "text"}
          - {label: "GitHub URL", name: "github", widget: "string"}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string"}
          - {label: "Twitter URL", name: "twitter", widget: "string"}
          - {label: "Instagram URL", name: "instagram", widget: "string"}
  
  - name: "projects"
    label: "Proyectos"
    folder: "admin/data/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Imagen", name: "image", widget: "image"}
      - {label: "Categoría", name: "category", widget: "select", options: ["web", "mobile", "design"]}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "GitHub URL", name: "github_url", widget: "string", required: false}
      - {label: "Demo URL", name: "demo_url", widget: "string", required: false}
      - {label: "Orden", name: "order", widget: "number", default: 0}
  
  - name: "experience"
    label: "Experiencia"
    folder: "admin/data/experience"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Empresa/Proyecto", name: "company", widget: "string"}
      - {label: "Fecha", name: "date", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Puntos destacados", name: "highlights", widget: "list"}
      - {label: "Tipo", name: "type", widget: "select", options: ["trabajo", "educacion"]}
      - {label: "Orden", name: "order", widget: "number", default: 0}
